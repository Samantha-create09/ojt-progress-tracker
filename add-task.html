<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Task</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">

  <h2>OJT Tracker</h2>

  <a href="index.html">🏠 Dashboard</a>
  <a href="add-task.html">➕ Add Task</a>
  <a href="analytics.html">📊 Analytics</a>
  <a href="notes.html">📝 Growth Hub</a>

</div>

<div class="main">

  <div class="planner-layout">

    <div>
    
    <h1>Add New Task</h1>
    
    <form id="taskForm" class="task-form">
    
    <input
    type="text"
    id="title"
    placeholder="Task Title"
    required>
    
    <select id="category" required>
    
    <option value="">
    Select Category
    </option>
    
    <option value="Frontend">
    Frontend
    </option>
    
    <option value="Backend">
    Backend
    </option>
    
    <option value="Database">
    Database
    </option>
    
    <option value="GitHub">
    GitHub
    </option>
    
    </select>
    
    <select id="priority" required>
    
    <option value="">
    Select Priority
    </option>
    
    <option value="High">
    High
    </option>
    
    <option value="Medium">
    Medium
    </option>
    
    <option value="Low">
    Low
    </option>
    
    </select>
    
    <input
    type="time"
    id="startTime"
    required>
    
    <input
    type="time"
    id="deadline"
    required>
    
    <input
    type="date"
    id="date"
    required>
    
    <label>Learning / Notes</label>

<textarea
id="notes"
placeholder="What did you learn today?">
</textarea>

<label>Mentor Feedback</label>

<textarea
id="mentorFeedback"
placeholder="Feedback from mentor">
</textarea>

<label>Error / Challenge Faced</label>

<textarea
id="errors"
placeholder="Errors, bugs or blockers">
</textarea>
    
    <button type="submit">
    Add Task
    </button>
    
    </form>
    
    </div>
    
    <div class="planner-calendar">
    
    <div class="calendar-header">
    
    <button onclick="previousMonth()">
    ◀
    </button>
    
    <h2 id="monthYear">
    May 2026
    </h2>
    
    <button onclick="nextMonth()">
    ▶
    </button>
    
    </div>
    
    <div class="calendar-days">
    
    <div>Sun</div>
    <div>Mon</div>
    <div>Tue</div>
    <div>Wed</div>
    <div>Thu</div>
    <div>Fri</div>
    <div>Sat</div>
    
    </div>
    
    <div
    id="calendarGrid"
    class="calendar-grid">
    </div>
    
    <h3 class="selected-title">
    
    Tasks on Selected Date
    
    </h3>
    
    <div id="selectedTasks">
    
    Select a date
    
    </div>
    
    </div>
    
    </div>


</div>

<script src="script.js"></script>
<script src="planner-calendar.js"></script>

</body>
</html>
