<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OJT Progress Tracker</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="sidebar">

<h2>OJT Tracker</h2>

<a href="index.html">🏠 Home</a>

<a href="add-task.html">➕ Add Task</a>

<a href="analytics.html">📊 Analytics</a>

<a href="notes.html">📝 Notes</a>

</div>

<div class="main">

<!-- HERO SECTION -->

<div class="hero-section">

<div class="hero-text">

<h1>Good Evening, Samantha! 👋</h1>

<p>
Let's make today productive and meaningful.
</p>

</div>

<div class="hero-image">

<img src="girl.png" alt="Girl Illustration">

</div>

</div>

<!-- DASHBOARD GRID -->

<div class="dashboard-grid">

<!-- TASKS SECTION -->

<div class="tasks-section">

<div class="section-header">

<h2>Today's Priorities</h2>

<span>View All</span>

</div>

<div id="taskContainer" class="task-list"></div>

<div class="motivation-box">

“You don't have to be great to start,
but you have to start to be great.” 🚀

</div>

</div>

<!-- RIGHT SIDEBAR -->

<div class="right-panel">

<div class="deadline-box">

<h3>Upcoming Deadlines</h3>

<div id="deadlineContainer"></div>

</div>

<div class="timer-box">

<h3>Focus Timer</h3>

<div class="timer-circle">

25:00

</div>

<button class="focus-btn">
▶ Start
</button>

</div>

</div>

</div>

</div>

<script src="script.js"></script>
